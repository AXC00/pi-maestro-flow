[package]
name = "scrollback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cell surface + blitz-dom layout → terminal cell renderer (P1)."

[dependencies]
# blitz-dom 0.3.0-beta.2 headless DOM (see pi-tui/SPIKE-NOTES.md).
# `system-fonts` is NOT required: tests inject a pinned FontContext via
# `blitz_dom::build_single_font_ctx(blitz_dom::BULLET_FONT)`.
blitz-dom = { version = "=0.3.0-beta.2", default-features = false }
blitz-traits = "=0.3.0-beta.2"
parley = { version = "0.11", features = ["complex-scripts"] }
# `stylo` is blitz-dom's `style` dependency (renamed). The crate's lib target
# is named `style`, so the dependency must be imported under that name. Needed
# for the computed-value enums (Position/Overflow/BorderStyle/TextDecorationLine/…)
# that appear in `ComputedValues` accessors.
style = { package = "stylo", version = "0.20.0" }
# taffy types appear in blitz-dom's public API (`Node::style()`,
# `final_layout()`, `HoistedPaintChild::position`). Features must match
# blitz-dom's set exactly — extra features (e.g. float_layout) add fields
# to taffy::Style that stylo_taffy's initializers don't know.
taffy = { version = "0.14", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
unicode-segmentation = "1"
unicode-width = "0.2"
